version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      tanstack:
        patterns: ['@tanstack/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/test', 'jsdom']
      lint:
        patterns: ['eslint', '@eslint/*', 'eslint-*', 'typescript-eslint', 'prettier', 'prettier-*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TS 7 yet (see ADR 0001).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(devcontainer)
