name: Feature
description: An idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is slow, missing or annoying today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Formulas or reference values must come from a cited source, never guessed.
