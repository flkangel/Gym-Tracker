name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Never paste personal data (weights, measurements, photos) or keys.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Hoy\n2. Tap ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Installed PWA (iPhone), Safari (iPhone), Desktop browser, Capacitor app]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
