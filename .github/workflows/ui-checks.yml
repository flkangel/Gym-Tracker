# E2E (WebKit iPhone) and Lighthouse CI. Manual for now: they only test a
# shell until the Phase 4 MVP lands, then they move to pull_request.
name: UI checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (WebKit iPhone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm lhci
