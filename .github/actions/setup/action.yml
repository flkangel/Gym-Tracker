name: Setup
description: Node (from .nvmrc) + pnpm (from packageManager) with cached store, then install.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        cache: true
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - run: pnpm install --frozen-lockfile
      shell: bash
